tridi_core.quote.settings:
  type: config_object
  label: 'Quote calculator settings'
  mapping:
    hourly_cost:
      type: float
      label: 'Printing cost per hour'
    complexity:
      type: sequence
      label: 'Complexity levels'
      sequence:
        type: mapping
        label: 'Complexity level'
        mapping:
          label:
            type: label
            label: 'Label'
          multiplier:
            type: float
            label: 'Multiplier'
    profit:
      type: sequence
      label: 'Profit types'
      sequence:
        type: mapping
        label: 'Profit type'
        mapping:
          label:
            type: label
            label: 'Label'
          percentage:
            type: float
            label: 'Profit percentage'
